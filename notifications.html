<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thông Báo Hệ Thống — NhiLun</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/notifications.css">
</head>
<body>

  <div class="profile-app-container">

    <!-- SIDEBAR -->
    <aside class="profile-sidebar">
      <a href="index.html" class="sidebar-brand-box">
        <div class="sidebar-brand-logo">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="#10B981"/>
            <path d="M9 13c1.5-1.5 4.5-1.5 6 0" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <span class="sidebar-brand-title">NhiLun</span>
      </a>

      <ul class="sidebar-menu-list">
        <li class="sidebar-menu-item"><a href="index.html"><span class="sidebar-menu-label"><i class="ri-home-4-line sidebar-menu-icon"></i><span>Trang chủ</span></span></a></li>
        <li class="sidebar-menu-item"><a href="activities.html"><span class="sidebar-menu-label"><i class="ri-compass-3-line sidebar-menu-icon"></i><span>Hoạt động</span></span></a></li>
        <li class="sidebar-menu-item"><a href="stories.html"><span class="sidebar-menu-label"><i class="ri-book-open-line sidebar-menu-icon"></i><span>Stories</span></span></a></li>
        <li class="sidebar-menu-item"><a href="about.html"><span class="sidebar-menu-label"><i class="ri-team-line sidebar-menu-icon"></i><span>Giới thiệu</span></span></a></li>
        <li class="sidebar-menu-item"><a href="dashboard.html"><span class="sidebar-menu-label"><i class="ri-bar-chart-2-line sidebar-menu-icon"></i><span>Dashboard</span></span></a></li>
        <li class="sidebar-menu-item"><a href="schedule.html"><span class="sidebar-menu-label"><i class="ri-calendar-line sidebar-menu-icon"></i><span>Lịch hoạt động</span></span></a></li>
        <li class="sidebar-menu-item active"><a href="notifications.html"><span class="sidebar-menu-label"><i class="ri-notification-3-line sidebar-menu-icon"></i><span>Thông báo</span></span><span class="sidebar-badge">3</span></a></li>
        <li class="sidebar-menu-item"><a href="profile.html"><span class="sidebar-menu-label"><i class="ri-user-3-line sidebar-menu-icon"></i><span>Hồ sơ cá nhân</span></span></a></li>
        <li class="sidebar-menu-item"><a href="volunteer/dashboard.html"><span class="sidebar-menu-label"><i class="ri-file-list-3-line sidebar-menu-icon"></i><span>Hoạt động của tôi</span></span></a></li>
        <li class="sidebar-menu-item"><a href="certificates.html"><span class="sidebar-menu-label"><i class="ri-award-line sidebar-menu-icon"></i><span>Chứng nhận</span></span></a></li>
      </ul>
    </aside>

    <!-- MAIN AREA -->
    <main class="profile-main-area">

      <!-- TOPBAR -->
      <div class="profile-topbar">
        <div class="topbar-search-box">
          <i class="ri-search-line topbar-search-icon"></i>
          <input type="text" class="topbar-search-input" placeholder="Tìm kiếm thông báo...">
        </div>
        <div class="topbar-right-actions">
          <!-- POPUP AVATAR NGƯỜI DÙNG KÈM DASHBOARD PHÂN ROLE, PROFILE, CÀI ĐẶT, ĐĂNG XUẤT -->
          <div id="vhUserNavWrap"></div>
        </div>
      </div>

      <div class="notify-container-card">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-default); padding-bottom: 12px;">
          <div>
            <h1 style="margin: 0; font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 8px;"><i class="ri-notification-3-line" style="color: var(--brand-primary);"></i> Thông Báo Của Bạn</h1>
            <span id="notifySubtitle" style="font-size: 0.74rem; color: var(--text-secondary);">Bạn có 0 thông báo mới chưa đọc</span>
          </div>
          <button type="button" class="btn btn-sm btn-outline" onclick="handleMarkAllRead()" style="display: inline-flex; align-items: center; gap: 6px;">
            <i class="ri-check-double-line"></i> Đánh dấu tất cả đã đọc
          </button>
        </div>

        <div class="notify-list" id="mainNotifyList">
          <!-- Rendered dynamically -->
        </div>
      </div>

    </main>
  </div>

  <script src="data/seedData.js"></script>
  <script src="shared/useStorage.js"></script>
  <script src="shared/useRepository.js"></script>
  <script src="shared/useToast.js"></script>
  <script src="shared/useTheme.js"></script>
  <script src="shared/useAuth.js"></script>
  <script src="shared/useNotification.js"></script>
  <script>
    let currentFilterText = '';

    function getCurrentUserId() {
      const u = typeof useAuth !== 'undefined' ? useAuth.getCurrentUser() : null;
      return u && u.id ? u.id : 'USR-001';
    }

    function renderNotifications() {
      const userId = getCurrentUserId();
      let notifs = useRepository.getNotifications(userId);
      const container = document.getElementById('mainNotifyList');
      const subtitle = document.getElementById('notifySubtitle');
      const badge = document.querySelector('.sidebar-menu-item.active .sidebar-badge');

      if (currentFilterText) {
        const q = currentFilterText.toLowerCase();
        notifs = notifs.filter(n => (n.title && n.title.toLowerCase().includes(q)) || (n.desc && n.desc.toLowerCase().includes(q)));
      }

      const unreadCount = notifs.filter(n => n.unread).length;
      if (subtitle) {
        subtitle.textContent = `Bạn có ${unreadCount} thông báo mới chưa đọc`;
      }
      if (badge) {
        badge.textContent = unreadCount;
        badge.style.display = unreadCount > 0 ? 'inline-block' : 'none';
      }

      if (!container) return;

      if (notifs.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 48px 16px; color: var(--text-secondary);">
            <div style="font-size: 2.5rem; margin-bottom: 8px;"><i class="ri-inbox-archive-line"></i></div>
            <p>Không có thông báo nào phù hợp.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = notifs.map(n => {
        const typeClass = n.type === 'success' ? 'success' : (n.type === 'warning' ? 'warning' : 'info');
        const fallbackIcon = n.type === 'success' ? '<i class="ri-checkbox-circle-line"></i>' : (n.type === 'warning' ? '<i class="ri-time-line"></i>' : '<i class="ri-notification-3-line"></i>');
        const icon = (n.icon && (n.icon.includes('<i') || n.icon.length > 5)) ? n.icon : fallbackIcon;
        const unreadClass = n.unread ? 'unread' : '';
        const link = n.link || '#';
        return `
          <div class="notify-item-card ${unreadClass}" onclick="handleReadSingle('${n.id}', '${link}')">
            <div class="notify-icon-circle ${typeClass}">${icon}</div>
            <div class="notify-body-text" style="flex: 1;">
              <strong>${n.title || ''}</strong>
              <p>${n.desc || ''}</p>
              <span class="notify-time-stamp"><i class="ri-time-line"></i> ${n.time || 'Vừa xong'}</span>
            </div>
            <div>
              <a href="${link}" class="btn btn-sm ${n.unread ? 'btn-primary' : 'btn-outline'}" onclick="event.stopPropagation(); handleReadSingle('${n.id}', '${link}')">
                Chi tiết
              </a>
            </div>
          </div>
        `;
      }).join('');
    }

    function handleMarkAllRead() {
      const userId = getCurrentUserId();
      useRepository.markAllNotificationsRead(userId);
      renderNotifications();
      useToast.show('Đã đánh dấu đọc tất cả thông báo!', 'success');
    }

    function handleReadSingle(id, link) {
      useRepository.markNotificationRead(id);
      renderNotifications();
      if (link && link !== '#') {
        window.location.href = link;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      useTheme.init();
      useRepository.init();
      renderNotifications();

      const searchInput = document.querySelector('.topbar-search-input');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          currentFilterText = e.target.value.trim();
          renderNotifications();
        });
      }
    });
  </script>
</body>
</html>
