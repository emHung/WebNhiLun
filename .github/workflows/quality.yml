name: Code quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Next.js build and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-credential
      API_INTERNAL_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend

  backend:
    name: FastAPI offline tests and Bandit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      PYTHONPATH: backend
      SUPABASE_URL: https://ci-placeholder.supabase.co
      SUPABASE_DB_URL: postgresql://ci:placeholder@127.0.0.1:5432/ci
      DEMO_LOGIN_ENABLED: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-ci.txt
      - run: python -m pip install -r backend/requirements.lock -r backend/requirements-ci.txt
      - run: python -m pip check
      - run: python -m coverage run -m unittest discover -s backend/tests -v
      - run: python -m coverage xml
      - run: python -m bandit -r backend/app -f json -o bandit-report.json --exit-zero
      - name: Enforce Bandit severity and confidence gate
        run: python -m bandit -r backend/app -ll -ii
      - name: Save test and security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: backend-quality
          path: |
            coverage.xml
            bandit-report.json
          retention-days: 7

  sonar:
    name: SonarQube Cloud (requires account setup)
    permissions:
      contents: read
      actions: read
    needs: [frontend, backend]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check SonarQube configuration
        id: config
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          if [ -z "$SONAR_TOKEN" ] || [ -z "$SONAR_ORGANIZATION" ] || [ -z "$SONAR_PROJECT_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SonarQube analysis NOT RUN: configure SONAR_TOKEN, SONAR_ORGANIZATION and SONAR_PROJECT_KEY."
            echo '### SonarQube: NOT RUN — account/project configuration missing' >> "$GITHUB_STEP_SUMMARY"
            echo 'Build, offline tests and Bandit results are separate checks. This is not a passing Sonar Quality Gate.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.config.outputs.ready == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download Python coverage
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name backend-quality --dir .
      - name: Scan and wait for Quality Gate
        if: steps.config.outputs.ready == 'true'
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
